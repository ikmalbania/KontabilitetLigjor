<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kurset e Mia — IKM</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="watermark"></div>
<header class="topbar">
  <div class="topbar-inner">
    <a href="/course/" class="brand">IKM <span>Platforma e Kurseve</span></a>
    <div class="user-info">
      <span id="user-email"></span>
      <button id="change-password-btn" class="btn-ghost">Ndrysho fjalëkalimin</button>
      <button id="logout-btn" class="btn-ghost">Dil</button>
    </div>
  </div>
</header>
<div class="layout" style="grid-template-columns: 1fr;">
  <main class="content" id="protected-content">
    <div class="module-header">
      <span class="module-tag">Llogaria Ime</span>
      <h1>Kurset e Mia</h1>
    </div>
    <div id="forbidden-notice" style="display:none" class="admin-banner">
      Nuk ke akses në kursin që kërkove. Nëse mendon se është gabim, kontakto administratorin.
    </div>
    <div id="loading">Duke ngarkuar…</div>
    <div class="course-grid" id="course-grid" style="display:none"></div>
  </main>
</div>
<script src="/js/auth-gate.js"></script>
<script>
function esc(s) {
  var d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}
if (window.location.search.indexOf('forbidden=1') !== -1) {
  document.getElementById('forbidden-notice').style.display = 'block';
}
fetch('/api/list-courses', { credentials: 'same-origin' })
  .then(function (r) { return r.json(); })
  .then(function (data) {
    var grid = document.getElementById('course-grid');
    var courses = data.courses || [];
    if (!courses.length) {
      grid.innerHTML = '<p>Nuk ke akses në asnjë kurs ende. Kontakto administratorin.</p>';
    } else {
      grid.innerHTML = courses.map(function (c) {
        return '<a class="course-card" href="/course/' + encodeURIComponent(c.slug) + '/modul-1/">' +
          '<div class="course-card-tag">Aktiv</div>' +
          '<h2>' + esc(c.name) + '</h2>' +
          '<p>' + c.moduleCount + ' module.</p>' +
          '<span class="course-card-cta">Vazhdo kursin →</span>' +
        '</a>';
      }).join('');
    }
    document.getElementById('loading').style.display = 'none';
    grid.style.display = 'grid';
  })
  .catch(function () {
    document.getElementById('loading').textContent = 'Gabim gjatë ngarkimit të kurseve.';
  });
</script>
<style>
  .course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 20px; margin-top: 8px; }
  .course-card { background: #fff; border: 1px solid #DCE3EA; border-radius: 8px; padding: 24px; display: block; transition: box-shadow .15s, transform .15s; }
  .course-card:hover { box-shadow: 0 8px 24px rgba(19,51,97,0.12); transform: translateY(-2px); text-decoration: none; }
  .course-card h2 { font-family: Georgia, serif; color: #133361; font-size: 19px; margin: 10px 0 8px; }
  .course-card p { color: #4A5A6B; font-size: 14px; margin: 0 0 14px; text-align: left; }
  .course-card-tag { display: inline-block; background: #0078B9; color: #fff; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 3px; }
  .course-card-cta { color: #00569C; font-weight: 600; font-size: 14px; }
</style>
</body>
</html>
