<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paneli i Administratorit — Kontabilist Ligjor</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="watermark"></div>
<header class="topbar">
  <div class="topbar-inner">
    <a href="/admin/" class="brand">IKM <span>Admin</span></a>
    <div class="user-info">
      <span id="user-email"></span>
      <button id="logout-btn" class="btn-ghost">Dil</button>
    </div>
  </div>
</header>
<div class="admin-shell" id="protected-content">
  <div class="admin-header">
    <h1>Paneli i Administratorit</h1>
    <div class="admin-nav-links">
      <a href="/admin/users/">Përdoruesit</a>
      <a href="/course/">Shiko kursin si student</a>
    </div>
  </div>

  <div class="admin-banner" id="seed-banner" style="display:none">
    Nuk ka ende përmbajtje dinamike të ngarkuar. Për fillim, importo modulet
    ekzistuese nga skedari statik i site-it (nuk fshin asgjë, vetëm shton
    çfarë mungon).
    <button class="btn-primary" id="seed-btn" style="width:auto;padding:6px 16px">Importo Modulet</button>
  </div>

  <div id="courses-container">Duke ngarkuar…</div>

  <div class="admin-toolbar">
    <button class="btn-ghost" id="show-create-course-btn" style="color:var(--navy);border-color:var(--line)">+ Krijo Kurs të Ri</button>
  </div>
  <div id="create-course-box" style="display:none;max-width:520px;margin:12px 0">
    <input type="text" id="new-course-name" placeholder="Emri i kursit (p.sh. Auditimi i Brendshëm)"
      style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px">
    <input type="text" id="new-course-slug" placeholder="slug (p.sh. auditimi-i-brendshem — vetëm shkronja/numra/vizë)"
      style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;font-family:monospace">
    <button class="btn-primary" id="create-course-btn" style="width:auto;padding:8px 18px">Krijo Kursin</button>
    <span id="create-course-status" style="font-size:13px;margin-left:8px"></span>
  </div>
</div>
<script src="/js/auth-gate.js"></script>
<script>
async function getJSON(url) {
  var res = await fetch(url, { credentials: 'same-origin' });
  if (!res.ok) {
    var body = {};
    try { body = await res.json(); } catch (e) {}
    throw new Error(body.error || ('Gabim (' + res.status + ')'));
  }
  return res.json();
}
async function postJSON(url, data) {
  var res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    body: JSON.stringify(data || {}),
  });
  var body = {};
  try { body = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error(body.error || ('Gabim (' + res.status + ')'));
  return body;
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

async function load() {
  var data;
  try {
    data = await getJSON('/api/admin-list-modules');
  } catch (err) {
    document.getElementById('courses-container').textContent = 'Gabim: ' + err.message;
    return;
  }

  var anyContent = data.courses.some(function (c) { return c.modules.some(function (m) { return m.hasContent; }); });
  if (!anyContent) {
    document.getElementById('seed-banner').style.display = 'block';
  }

  var container = document.getElementById('courses-container');
  container.innerHTML = '';
  data.courses.forEach(function (course) {
    var block = document.createElement('div');
    block.className = 'admin-course-block';
    var rows = course.modules.map(function (m) {
      return '<tr>' +
        '<td>' + (m.isReference ? '<em>Material Referues</em>' : ('Moduli ' + esc(m.num))) + '</td>' +
        '<td>' + esc(m.label) + '</td>' +
        '<td class="' + (m.hasContent ? 'admin-status-yes' : 'admin-status-no') + '">' +
          (m.hasContent ? (m.blockCount + ' blloqe') : 'Pa përmbajtje') + '</td>' +
        '<td>' + m.slideCount + ' Slides</td>' +
        '<td>' +
          '<label style="display:block;font-size:12px;white-space:nowrap"><input type="checkbox" class="vis-toggle" data-kind="hidden" data-slug="' + esc(course.slug) + '" data-num="' + esc(m.num) + '"' + (m.hidden ? ' checked' : '') + '> Moduli i fshehur</label>' +
          (m.slideCount > 0 ? '<label style="display:block;font-size:12px;white-space:nowrap"><input type="checkbox" class="vis-toggle" data-kind="slidesHidden" data-slug="' + esc(course.slug) + '" data-num="' + esc(m.num) + '"' + (m.slidesHidden ? ' checked' : '') + '> Prezantimi i fshehur</label>' : '') +
        '</td>' +
        '<td>' +
          '<a class="admin-action" href="/admin/edit/?course=' + encodeURIComponent(course.slug) + '&modnum=' + encodeURIComponent(m.num) + '">Edito tekstin</a>' +
          '<a class="admin-action" href="/admin/slides/?course=' + encodeURIComponent(course.slug) + '&modnum=' + encodeURIComponent(m.num) + '">Slides</a>' +
        '</td>' +
      '</tr>';
    }).join('');
    block.innerHTML =
      '<h2>' + esc(course.name) + '</h2>' +
      '<div style="margin-bottom:8px"><a class="admin-action" href="/admin/edit/?course=' + encodeURIComponent(course.slug) + '&modnum=_description">Edito Përshkrimin e Kursit</a>' +
        ' <span style="color:#8A97A6;font-size:12px">(shfaqet para moduleve, kur studenti klikon te kursi)</span></div>' +
      '<table class="admin-table"><thead><tr><th>Moduli</th><th>Titulli</th><th>Përmbajtja</th><th>Prezantimi</th><th>Dukshmëria</th><th></th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>' +
      '<div style="margin-top:10px">' +
        '<button class="btn-ghost add-module-btn" data-slug="' + esc(course.slug) + '" style="color:var(--navy);border-color:var(--line);font-size:13px;padding:5px 12px">+ Shto Modul</button> ' +
        '<button class="btn-ghost add-reference-btn" data-slug="' + esc(course.slug) + '" style="color:var(--navy);border-color:var(--line);font-size:13px;padding:5px 12px">+ Shto Material Referues</button>' +
        '<span class="add-module-status" style="font-size:13px;margin-left:8px"></span>' +
      '</div>';
    container.appendChild(block);
  });

  document.querySelectorAll('.add-module-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var slug = btn.getAttribute('data-slug');
      var num = prompt('Numri i modulit (p.sh. 11):');
      if (!num) return;
      var label = prompt('Titulli i shkurtër i modulit (shfaqet te menyja majtas):');
      if (!label) return;
      var statusEl = btn.parentElement.querySelector('.add-module-status');
      postJSON('/api/admin-add-module', { course: slug, num: num, label: label })
        .then(function () { return load(); })
        .catch(function (err) { statusEl.textContent = 'Gabim: ' + err.message; });
    });
  });

  document.querySelectorAll('.add-reference-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var slug = btn.getAttribute('data-slug');
      var key = prompt('Identifikuesi i shkurtër (p.sh. "fjalori", "kuadri-ligjor", "bibliografia") — vetëm shkronja të vogla, numra, vizë:');
      if (!key) return;
      var label = prompt('Titulli i shfaqur në meny (p.sh. "Fjalori i Termave"):');
      if (!label) return;
      var statusEl = btn.parentElement.querySelector('.add-module-status');
      postJSON('/api/admin-add-module', { course: slug, num: key, label: label, isReference: true })
        .then(function () { return load(); })
        .catch(function (err) { statusEl.textContent = 'Gabim: ' + err.message; });
    });
  });

  document.querySelectorAll('.vis-toggle').forEach(function (cb) {
    cb.addEventListener('change', function () {
      var slug = cb.getAttribute('data-slug');
      var num = cb.getAttribute('data-num');
      var kind = cb.getAttribute('data-kind'); // 'hidden' or 'slidesHidden'
      var payload = { course: slug, num: num };
      payload[kind] = cb.checked;
      cb.disabled = true;
      postJSON('/api/admin-set-module-flags', payload)
        .then(function () { return load(); })
        .catch(function (err) {
          alert('Gabim: ' + err.message);
          cb.checked = !cb.checked;
          cb.disabled = false;
        });
    });
  });
}

document.getElementById('show-create-course-btn').addEventListener('click', function () {
  var box = document.getElementById('create-course-box');
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
});
document.getElementById('create-course-btn').addEventListener('click', async function () {
  var status = document.getElementById('create-course-status');
  var name = document.getElementById('new-course-name').value.trim();
  var slug = document.getElementById('new-course-slug').value.trim();
  if (!name || !slug) { status.textContent = 'Plotëso emrin dhe slug-un.'; return; }
  this.disabled = true;
  try {
    await postJSON('/api/admin-create-course', { name: name, slug: slug });
    status.textContent = '✓ U krijua.';
    document.getElementById('new-course-name').value = '';
    document.getElementById('new-course-slug').value = '';
    await load();
  } catch (err) {
    status.textContent = 'Gabim: ' + err.message;
  }
  this.disabled = false;
});

document.getElementById('seed-btn').addEventListener('click', async function () {
  var btn = this;
  btn.disabled = true;
  btn.textContent = 'Duke importuar…';
  try {
    await postJSON('/api/admin-seed-content', { force: false });
    document.getElementById('seed-banner').style.display = 'none';
    await load();
  } catch (err) {
    alert('Gabim: ' + err.message);
    btn.disabled = false;
    btn.textContent = 'Importo Modulet';
  }
});

load();
</script>
</body>
</html>
